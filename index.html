    // ============================================================
    // ФУНКЦИЯ СМЕНЫ ЯЗЫКА
    // ============================================================
    let currentLang = 'ru';

    function setLang(lang) {
        currentLang = lang;
        // Обновляем активную кнопку
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            // Находим кнопку с нужным языком по атрибуту onclick
            if (btn.getAttribute('onclick') === "setLang('" + lang + "')") {
                btn.classList.add('active');
            }
        });
        // Применяем переводы
        const t = translations[lang];
        if (!t) return;
        document.querySelectorAll('[id^="t_"]').forEach(el => {
            const key = el.id.replace('t_', '');
            if (t[key] !== undefined) {
                el.innerHTML = t[key];
            }
        });
        // Обновляем статусы шагов (текст "Готово" и т.д.)
        updateStepStatusText();
        // Сохраняем выбор языка в браузере
        try { localStorage.setItem('jol-lang', lang); } catch(e) {}
    }

    // ============================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function updateStepStatusText() {
        const doneText = currentLang === 'ru' ? '✅ Готово' :
                        currentLang === 'en' ? '✅ Done' :
                        currentLang === 'zh' ? '✅ 完成' :
                        currentLang === 'ky' ? '✅ Даяр' : '✅ Дайын';
        const waitingText = currentLang === 'ru' ? '⏳ Ожидает' :
                           currentLang === 'en' ? '⏳ Waiting' :
                           currentLang === 'zh' ? '⏳ 等待中' :
                           currentLang === 'ky' ? '⏳ Күтүүдө' : '⏳ Күтуде';
        document.querySelectorAll('.step-status').forEach(el => {
            if (el.classList.contains('done')) {
                el.textContent = doneText;
            } else {
                el.textContent = waitingText;
            }
        });
    }

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

        updateFinishButton();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
